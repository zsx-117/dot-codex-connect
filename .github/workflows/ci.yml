name: Source preview checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Source, authentication and connector fixtures
        run: |
          bash skills/dot-codex-connect/scripts/setup-mac.sh --check
          bash skills/dot-codex-connect/scripts/setup-mac.sh --test
      - name: Queue and communication fixtures
        working-directory: service
        run: |
          node tests/cloud.mjs
          node --test tests/task-state.mjs tests/communication.mjs
      - name: Temporary loopback transport
        working-directory: selfhost
        run: node --test http.test.mjs
